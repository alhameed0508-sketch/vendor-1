# Neo4j configuration for IOB on-premise deployment
# Security-hardened settings

# Network
dbms.connector.bolt.enabled=true
dbms.connector.bolt.listen_address=:7687
dbms.connector.http.enabled=true
dbms.connector.http.listen_address=:7474

# TLS — Enable when certificates are generated (infra/security/gen_certs.sh)
# Uncomment for production:
# dbms.connector.bolt.tls_level=REQUIRED
# dbms.ssl.policy.bolt.enabled=true
# dbms.ssl.policy.bolt.base_directory=/ssl
# dbms.ssl.policy.bolt.private_key=neo4j.key
# dbms.ssl.policy.bolt.public_certificate=neo4j.crt
dbms.connector.bolt.tls_level=DISABLED

# Security
dbms.security.auth_enabled=true
dbms.security.procedures.unrestricted=apoc.*,gds.*
dbms.security.procedures.allowlist=apoc.*,gds.*

# Memory (production-tuned)
dbms.memory.heap.initial_size=1G
dbms.memory.heap.max_size=4G
dbms.memory.pagecache.size=2G

# Logging (RBI audit compliance)
dbms.logs.query.enabled=INFO
dbms.logs.query.threshold=100ms
dbms.logs.security.level=INFO

# Transaction timeout (prevent long-running queries)
dbms.transaction.timeout=60s
