apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mulecatch

resources:
  - namespace.yaml
  - configmap.yaml
  # A Secret named "mulecatch-secrets" must be provisioned separately by
  # External Secrets, Sealed Secrets, Vault, or the deployment pipeline.
  # Data stores
  - postgres-statefulset.yaml
  - postgres-service.yaml
  - neo4j-statefulset.yaml
  - neo4j-service.yaml
  - redis-deployment.yaml
  - redis-service.yaml
  - kafka-statefulset.yaml
  - kafka-service.yaml
  # Application
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  # Networking
  - ingress.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: mulecatch
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: true
