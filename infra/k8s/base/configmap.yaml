apiVersion: v1
kind: ConfigMap
metadata:
  name: mulecatch-config
  namespace: mulecatch
data:
  ENV: "production"
  AUTH_ENABLED: "true"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP: "kafka:9092"
  KAFKA_SECURITY_PROTOCOL: "PLAINTEXT"
  KAFKA_SSL_CAFILE: ""
  KAFKA_SSL_CERTFILE: ""
  KAFKA_SSL_KEYFILE: ""
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_TLS_ENABLED: "false"
  REDIS_URL: "redis://redis:6379/0"
  REPORTING_ENTITY: "Indian Overseas Bank"
  REPORTING_IFSC: "IOBA0000001"
  FIU_FORMAT_VERSION: "2.1"
  SMURF_FLAG_THRESHOLD: "0.55"
  ONBOARDING_RISK_THRESHOLD: "0.50"
  GNN_MODEL_PATH: "models/gnn/trained_model.pt"
  # Replace with identifiers approved through model/rule governance.
  MODEL_VERSION: "REPLACE_WITH_APPROVED_MODEL_VERSION"
  RULE_VERSION: "rules-2026.1"
  SCREENING_ENABLED: "true"
  LOG_LEVEL: "INFO"
