apiVersion: v1
kind: ConfigMap
metadata:
  name: mulecatch-config
  namespace: mulecatch
data:
  ENV: "production"
  AUTH_ENABLED: "true"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP: "kafka:9092"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  REDIS_URL: "redis://redis:6379/0"
  POSTGRES_URL: "postgresql://mulecatch:$(POSTGRES_PASSWORD)@postgres:5432/mulecatch"
  REPORTING_ENTITY: "Indian Overseas Bank"
  REPORTING_IFSC: "IOBA0000001"
  FIU_FORMAT_VERSION: "2.1"
  SMURF_FLAG_THRESHOLD: "0.55"
  ONBOARDING_RISK_THRESHOLD: "0.50"
  GNN_MODEL_PATH: "models/gnn/trained_model.pt"
  SCREENING_ENABLED: "true"
  LOG_LEVEL: "INFO"
