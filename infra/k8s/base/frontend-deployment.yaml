apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: mulecatch
  labels:
    app: mulecatch
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mulecatch
      component: frontend
  template:
    metadata:
      labels:
        app: mulecatch
        component: frontend
    spec:
      containers:
        - name: frontend
          image: mulecatch/frontend:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
