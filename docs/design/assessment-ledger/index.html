<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Template A · Triage lanes</title>
<link rel="stylesheet" href="common.css">
<style>
  .page { display: grid; grid-template-rows: auto auto 1fr auto; gap: 14px; height: 100%; }
  .hd { display: flex; align-items: center; gap: 12px; }
  .hd h1 { font-size: 20px; margin: 0; font-weight: 600; }
  .hd .sp { flex: 1; }
  .ribbon { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; }
  .ribbon > div { padding: 12px 16px; border-left: 1px solid var(--border); min-width: 0; }
  .ribbon > div:first-child { border-left: 0; }
  .ribbon .k { font-size: 12px; color: var(--text-muted); }
  .ribbon .v { font-size: 22px; font-weight: 600; margin-top: 2px; }
  .ribbon .s { font-size: 12px; color: var(--text-faint); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 14px; min-height: 0; }
  .lanes { display: grid; grid-template-rows: auto auto 1fr; gap: 10px; min-height: 0; }
  .lane { display: flex; flex-direction: column; min-height: 0; }
  .lane .panel__head { gap: 12px; }
  .lane__count { font-size: 12px; color: var(--text-muted); }
  .lane--act .panel__title { color: var(--critical); }
  .lane--review .panel__title { color: var(--high); }
  .lane .scroll { max-height: 330px; }
  .lane--clear .scroll { max-height: none; flex: 1; }
  .empty { padding: 14px; color: var(--text-faint); font-size: 13px; }
  .rail { display: grid; grid-template-rows: auto 1fr; gap: 14px; min-height: 0; }
  .dossier { padding: 14px; display: grid; gap: 12px; }
  .dossier h2 { margin: 0; font-size: 15px; font-family: var(--font-mono); font-weight: 500; }
  .kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 12px; }
  .kv .k { font-size: 11.5px; color: var(--text-faint); } .kv .v { font-size: 14px; font-weight: 600; }
  .why { display: grid; gap: 8px; }
  .why__row { display: grid; grid-template-columns: 22px 1fr 60px; gap: 8px; align-items: center; }
  .why__n { font-weight: 700; color: var(--accent); }
  .step { padding: 8px 10px; border: 1px solid var(--border-strong); border-radius: 8px; }
  .rank { padding: 4px 0; }
  .rank__row { display: grid; grid-template-columns: 26px 1fr 64px 28px; gap: 8px; align-items: center; padding: 5px 14px; font-size: 12.5px; }
  .rank__row.lit { background: var(--accent-tint); }
  .rank__row .lit-n { font-weight: 700; color: var(--accent); text-align: right; }
  .drawer { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: 12px; color: var(--text-muted); }
  .drawer .btn { padding: 5px 12px; font-weight: 500; }
</style>
</head>
<body>
<div class="shell" id="shell"></div>
<script src="data.js"></script><script src="spec.js"></script><script src="common.js"></script>
<script>
const { L, S } = H;
let sel = L.accounts.find((a) => a.classification !== 'CLEAN') || L.accounts[0];
const act = L.accounts.filter((a) => a.classification === 'COMPLICIT' && a.severity === 'CRITICAL');
const review = L.accounts.filter((a) => a.classification !== 'CLEAN' && !act.includes(a));
const clear = L.accounts.filter((a) => a.classification === 'CLEAN');

const row = (a) => `<tr data-id="${a.account_id}" class="${a === sel ? 'is-on' : ''}">
  <td class="mono">${H.short(a.account_id)}<span class="sub">age ${a.customer_age} · opened ${a.opened}</span></td>
  <td class="r num">${a.rows}</td>
  <td class="r num">${H.rupees(a.credit_amount)}<span class="sub">${a.credit_count} credits</span></td>
  <td class="r num">${H.rupees(a.debit_amount)}<span class="sub">${a.debit_count} debits</span></td>
  <td class="r num">${H.pct(a.pass_through)}</td>
  <td class="r num">${H.rupees(a.min_balance)}<span class="sub">${a.negative_rows} neg rows</span></td>
  <td>${a.drivers.map((d, i) => `<span class="drv"><span class="drv__n">${i + 1}</span><span class="drv__k">${d.feature}</span></span>`).join('<br>') || '<span class="faint">—</span>'}</td>
  <td><span class="cls cls--${a.classification}">${a.classification}</span><span class="sub">${a.ring ? 'Ring ' + a.ring : ''}</span></td>
  <td class="r num">${H.score(a.risk_score)}</td>
  <td>${a.suggested_step}</td></tr>`;
const table = (rows) => `<table class="tbl"><thead><tr><th>Account</th><th class="r">Txns</th><th class="r">Inflow</th><th class="r">Outflow</th><th class="r">Pass-through</th><th class="r">Min balance</th><th>Drivers 1–3</th><th>Class</th><th class="r">Score</th><th>Suggested step</th></tr></thead><tbody>${rows.map(row).join('')}</tbody></table>`;

function render() {
  const lit = new Map(sel.drivers.map((d, i) => [H.featureFor(d.feature)?.rank, i + 1]));
  document.getElementById('shell').innerHTML = H.shell('Assessment ledger') + `
  <main class="main"><div class="page">
    <div class="hd"><h1>Assessment ledger</h1>${H.sourceChip()}<span class="chip">${H.int(L.batch.rows)} rows · ${L.batch.accounts} accounts</span><span class="sp"></span><button class="btn">Upload CBS file</button></div>
    <div class="ribbon">
      <div><div class="k">Assessed transactions</div><div class="v num">${H.int(L.batch.rows)}</div><div class="s">${H.int(L.engine.normalized_transactions)} normalised · ${L.engine.internal_links} internal links</div></div>
      <div><div class="k">Recorded amount</div><div class="v num">${H.rupees(L.batch.total_amount)}</div><div class="s">Cr ${H.lakh(L.batch.credit.amount)} · Dr ${H.lakh(L.batch.debit.amount)}</div></div>
      <div><div class="k">Liens & overdraft</div><div class="v num">${H.rupees(L.batch.lien.amount)}</div><div class="s">${L.batch.negative_balance.rows} negative-balance rows</div></div>
      <div><div class="k">Flagged</div><div class="v num">${L.engine.flagged_accounts} <span class="muted" style="font-size:14px">accounts · ${L.engine.rings.length} ring</span></div><div class="s">${H.genuineLine()}</div></div>
      <div><div class="k">Top global drivers</div><div class="v" style="font-size:15px">smurf_score 30%</div><div class="s">2nd account_age_days 15% · 3rd device_trust_score 12%</div></div>
      <div><div class="k">Standards mapped</div><div class="v num">${S.standards.length}</div><div class="s">RBI FRM · DPSC · MSD · FREE-AI · MoF · I4C · PMLA</div></div>
    </div>
    <div class="body">
      <div class="lanes">
        <section class="panel lane lane--act"><div class="panel__head"><h2 class="panel__title">Act now</h2><span class="lane__count">${act.length} accounts · complicit, critical ring</span></div>
          <div class="scroll">${act.length ? table(act) : '<div class="empty">Nothing critical in this file.</div>'}</div></section>
        <section class="panel lane lane--review"><div class="panel__head"><h2 class="panel__title">Review</h2><span class="lane__count">${review.length} accounts</span></div>
          <div class="scroll">${review.length ? table(review) : '<div class="empty">No accounts waiting for review.</div>'}</div></section>
        <section class="panel lane lane--clear"><div class="panel__head"><h2 class="panel__title">Clear</h2><span class="lane__count">${clear.length} accounts · ${H.rupees(clear.reduce((s, a) => s + a.turnover, 0))} turnover · no ring membership</span></div>
          <div class="scroll">${table(clear)}</div></section>
      </div>
      <aside class="rail">
        <section class="panel"><div class="dossier">
          <h2>${sel.account_id}</h2>
          <div class="kv">
            <div><div class="k">Inflow</div><div class="v num">${H.rupees(sel.credit_amount)}</div></div>
            <div><div class="k">Outflow</div><div class="v num">${H.rupees(sel.debit_amount)}</div></div>
            <div><div class="k">Pass-through</div><div class="v num">${H.pct(sel.pass_through)}</div></div>
            <div><div class="k">Score</div><div class="v num">${H.score(sel.risk_score)}</div></div>
            <div><div class="k">Class</div><div class="v cls cls--${sel.classification}">${sel.classification}</div></div>
            <div><div class="k">Ring</div><div class="v">${sel.ring ?? '—'}</div></div>
          </div>
          <div class="why">${sel.drivers.map((d, i) => `<div class="why__row"><span class="why__n">${i + 1}</span><div><span class="drv__k">${d.feature}</span><div class="bar bar--accent"><i style="width:${Math.min(100, d.contribution / 0.2 * 100)}%"></i></div></div><span class="num r muted">${d.contribution.toFixed(3)}</span></div>`).join('') || '<span class="faint">Not flagged: no drivers listed.</span>'}</div>
          <div class="step"><span class="muted">Suggested step</span><br><strong>${sel.suggested_step}</strong></div>
        </div></section>
        <section class="panel" style="display:flex;flex-direction:column;min-height:0"><div class="panel__head"><h2 class="panel__title">Feature ranking</h2><span class="panel__note">spec weights · lit = this account</span></div>
          <div class="scroll rank">${S.features.map((f) => `<div class="rank__row${lit.has(f.rank) ? ' lit' : ''}"><span class="num faint">${f.rank}</span><span class="drv__k">${f.key}</span><div class="bar"><i style="width:${(f.shapPct ?? f.heuristicPct ?? 0) * 3}%"></i></div><span class="lit-n">${lit.get(f.rank) ?? ''}</span></div>`).join('')}</div></section>
      </aside>
    </div>
    <div class="drawer"><span>Reference</span><button class="btn">Standards (${S.standards.length})</button><button class="btn">Pipeline (${S.pipeline.length})</button><button class="btn">Channels (${L.channels.length})</button></div>
  </div></main>`;
  document.querySelectorAll('tbody tr').forEach((tr) => tr.addEventListener('click', () => { sel = L.accounts.find((a) => a.account_id === tr.dataset.id); render(); }));
}
render();
</script>
</body>
</html>
