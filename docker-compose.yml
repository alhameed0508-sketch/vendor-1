version: "3.9"

services:
  neo4j:
    image: neo4j:5.15
    container_name: mulecatch_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./infra/security/neo4j.conf:/conf/neo4j.conf
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - mulecatch_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mulecatch_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: BgN3batSRp2__cHksDT0cQ
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mulecatch_net

  redis:
    image: redis:7.2-alpine
    container_name: mulecatch_redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mulecatch_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mulecatch_backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_TLS_ENABLED: ${NEO4J_TLS_ENABLED:-false}
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      REDIS_URL: redis://redis:6379/0
      ENV: production
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./infra:/app/infra
      - audit_logs:/app/logs
    depends_on:
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mulecatch_net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mulecatch_frontend
    ports:
      - "3000:80"
      - "443:443"
    volumes:
      - ./infra/security/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    networks:
      - mulecatch_net
    restart: unless-stopped

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mulecatch_seed
    command: python -m data.seed_graph
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - ./data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - mulecatch_net
    profiles:
      - seed

volumes:
  neo4j_data:
  neo4j_logs:
  kafka_data:
  audit_logs:

networks:
  mulecatch_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16