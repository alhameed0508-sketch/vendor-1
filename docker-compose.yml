services:
  postgres:
    image: postgres:16-alpine
    container_name: mulecatch_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: mulecatch
      POSTGRES_USER: ${POSTGRES_USER:-mulecatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mulecatch_dev_2024}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mulecatch} -d mulecatch"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mulecatch_net

  neo4j:
    image: neo4j:5.15
    container_name: mulecatch_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-mulecatch2024}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      # Neo4j 5.x server config format
      # Sized for the local/reference stack; production overlays must size
      # managed Neo4j from the validated graph workload.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
      # Keep the process marker on the container's ephemeral /run filesystem.
      # A stale PID in the writable image layer otherwise prevents restart
      # after an abrupt Docker/host shutdown.
      NEO4J_server_directories_run: /run/neo4j
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    networks:
      - mulecatch_net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: mulecatch_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9093
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,HOST://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      CLUSTER_ID: BgN3batSRp2__cHksDT0cQ
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - mulecatch_net

  redis:
    image: redis:7.2-alpine
    container_name: mulecatch_redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mulecatch_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mulecatch_backend
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mulecatch2024}
      NEO4J_TLS_ENABLED: ${NEO4J_TLS_ENABLED:-false}
      KAFKA_BOOTSTRAP: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_in_production}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      POSTGRES_URL: postgresql://${POSTGRES_USER:-mulecatch}:${POSTGRES_PASSWORD:-mulecatch_dev_2024}@postgres:5432/mulecatch
      REDIS_URL: redis://redis:6379/0
      ENV: ${ENV:-development}
      DEMO_INVESTIGATOR_PASSWORD: ${DEMO_INVESTIGATOR_PASSWORD:-iob@2024}
      DEMO_SUPERVISOR_PASSWORD: ${DEMO_SUPERVISOR_PASSWORD:-supervisor@2024}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-admin@2024}
      GENAI_ENABLED: ${GENAI_ENABLED:-false}
      GENAI_PROVIDER: ${GENAI_PROVIDER:-gemini}
      GENAI_API_KEY: ${GENAI_API_KEY:-}
      BENCHMARK_RESULTS_PATH: /app/logs/benchmark_results.json
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./infra:/app/infra:ro
      - audit_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mulecatch_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mulecatch_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mulecatch_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: mulecatch_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mulecatch_net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: mulecatch_grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-mulecatch}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - mulecatch_net
    restart: unless-stopped

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mulecatch_seed
    command: python -m data.seed_graph
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-mulecatch2024}
      PYTHONPATH: /app
    volumes:
      - ./data:/app/data
      - ./models:/app/models:ro
      - ./infra:/app/infra:ro
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - mulecatch_net
    profiles:
      - seed

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  kafka_data:
  redis_data:
  audit_logs:
  prometheus_data:
  grafana_data:

networks:
  mulecatch_net:
    driver: bridge
